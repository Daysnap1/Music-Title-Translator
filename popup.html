<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 260px;
         color: #1f1b2e; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 24px; height: 24px; }
  label { display: block; font-size: 12px; color: #5b5670; margin-bottom: 4px; }
  select { width: 100%; padding: 6px; font: inherit; border: 1px solid #c9c4dc; border-radius: 6px; }
  p { font-size: 12px; color: #5b5670; margin: 10px 0 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1d29; color: #ece9f6; }
    label, p { color: #aaa4c2; }
    select { background: #2a2836; color: #ece9f6; border-color: #48445c; }
  }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Music Title Translator</h1>
  <label for="target">Translate titles into</label>
  <select id="target"></select>
  <p>Works on YouTube Music, Spotify and Apple Music. Hover a translated title to see the original.</p>
  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
